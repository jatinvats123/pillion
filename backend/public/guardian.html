<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin">
<meta name="color-scheme" content="light dark">
<title>Pillion Live</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #F6F3EE; --surface: #FFFDFA; --high: #ECE8E1; --ink: #17150F; --muted: #5F5A51;
    --line: #E3DED5; --accent: #F2A900; --live: #17735C; --live-dot: #1FA88A; --off: #9C978E;
    --danger: #B42318; --talk: #D92D20;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111110; --surface: #1B1A18; --high: #272522; --ink: #F3F0EA; --muted: #A9A49A;
      --line: #33302C; --accent: #FFB81F; --live: #5FD4B4; --live-dot: #3CCFAE; --off: #7D786F;
      --danger: #FF8A7F; --talk: #FF5247;
    }
    .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.9); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 16px/1.4 Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
  }
  .brand { font-size: 14px; color: var(--muted); margin: 0 0 4px; }
  h1 { font-size: 32px; line-height: 1.25; margin: 0; overflow-wrap: anywhere; }
  .status { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 6px 14px;
    border-radius: 999px; background: var(--high); font-size: 16px; font-variant-numeric: tabular-nums; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--off); flex: none; }
  .status.online .dot { background: var(--live-dot); }
  .status.ok .dot { background: var(--live-dot); }
  .card { background: var(--surface); border-radius: 28px; margin-top: 20px; overflow: hidden; }
  #map { height: min(44vh, 360px); background: var(--high); }
  #map.empty { display: grid; place-items: center; color: var(--muted); padding: 24px; text-align: center; }
  .where { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px;
    font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .where a { color: var(--ink); font-weight: 600; text-decoration: none; padding: 10px 16px; border-radius: 999px;
    background: var(--high); white-space: nowrap; }
  .voice { padding: 24px 20px; display: grid; gap: 16px; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  #listen { min-height: 64px; border-radius: 999px; background: var(--accent); color: #17150F; font-size: 20px; font-weight: 600; }
  #listen.on { background: var(--high); color: var(--ink); }
  #talk { justify-self: center; width: 152px; height: 152px; border-radius: 50%; background: var(--ink); color: var(--bg);
    font-size: 20px; font-weight: 600; line-height: 1.3; touch-action: none; user-select: none;
    -webkit-user-select: none; -webkit-touch-callout: none; transition: transform .15s, background .25s; }
  #talk[aria-pressed="true"] { background: var(--talk); color: #fff; transform: scale(1.06); }
  #talk:disabled { opacity: .35; cursor: default; }
  #talk small { display: block; font-weight: 400; font-size: 14px; opacity: .85; }
  .hint { margin: 0; text-align: center; color: var(--muted); font-size: 15px; min-height: 21px; }
  .hint.warn { color: var(--danger); }
  .foot { margin-top: 20px; color: var(--muted); font-size: 14px; }
  .leaflet-container { font: inherit; }
  @media (prefers-reduced-motion: reduce) { #talk { transition: none; } }
</style>
</head>
<body>
<main>
  <p class="brand">Pillion · Live Guardian</p>
  <h1 id="name">…</h1>
  <div class="status" id="status" role="status" aria-live="polite"><span class="dot"></span><span id="statusText">Connecting…</span></div>

  <section class="card" aria-label="Location">
    <div id="map" class="empty">Waiting for location…</div>
    <div class="where"><span id="fix"></span><a id="gmaps" href="#" target="_blank" rel="noopener noreferrer" hidden>Open in Maps</a></div>
  </section>

  <section class="card voice" aria-label="Voice">
    <button id="listen" type="button">Listen · सुनिए</button>
    <button id="talk" type="button" aria-pressed="false" disabled>Hold to talk<small>दबाकर बोलिए</small></button>
    <p class="hint" id="hint" aria-live="polite">Tap Listen to hear them live.</p>
  </section>

  <p class="foot" id="foot">This page shows only their live location and voice.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/agora-rtc-sdk-ng@4.24.8/AgoraRTC_N-production.min.js"></script>
<script>
(() => {
  const base = location.pathname.replace(/\/+$/, '');
  const $ = (id) => document.getElementById(id);
  let name = 'Rider';
  let done = false;
  let map, marker, circle;
  let client = null, riderUid = null, micTrack = null, micDenied = false, talking = false;
  let mic = Promise.resolve(); // mic steps run one after another

  function expired() {
    if (done) return;
    done = true;
    leave();
    document.body.innerHTML = '<main><p class="brand">Pillion · Live Guardian</p><h1>This link has expired</h1>' +
      '<p class="foot">Call them directly if you still need to reach them.</p></main>';
  }

  function ago(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    if (s < 15) return 'just now';
    if (s < 60) return `${s} s ago`;
    const m = Math.round(s / 60);
    if (m < 60) return `${m} min ago`;
    return `${Math.floor(m / 60)} h ${m % 60} min ago`;
  }

  function hint(text, warn) {
    $('hint').textContent = text;
    $('hint').classList.toggle('warn', Boolean(warn));
  }

  function render(s) {
    name = s.name;
    $('name').textContent = s.name;
    document.title = `${s.name} · Pillion Live`;
    const status = $('status');
    status.className = 'status' + (s.riderOk ? ' ok' : s.online ? ' online' : '');
    $('statusText').textContent =
      s.riderOk ? 'Says they are OK' :
      s.online ? 'Connected' :
      s.location ? `Last seen ${ago(s.location.ageMs)}` : 'Not connected';
    const until = new Date(Date.now() + s.expiresInMs).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    $('foot').textContent = `This page shows only ${s.name}'s location and voice. The link expires at ${until}.` +
      (s.riderOk ? ' Location sharing stopped when they said they are OK.' : '');
    if (s.location) showLocation(s.location);
  }

  function showLocation(loc) {
    const at = [loc.lat, loc.lng];
    if (!map && window.L) {
      const el = $('map');
      el.classList.remove('empty');
      el.textContent = '';
      map = L.map(el, { zoomControl: false, attributionControl: true }).setView(at, 16);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '© OpenStreetMap',
      }).addTo(map);
      circle = L.circle(at, { radius: loc.accuracyM || 0, color: '#F2A900', weight: 1, fillOpacity: .12 }).addTo(map);
      marker = L.circleMarker(at, { radius: 9, color: '#17150F', weight: 3, fillColor: '#F2A900', fillOpacity: 1 }).addTo(map);
    } else if (map) {
      const moved = !marker.getLatLng().equals(at);
      marker.setLatLng(at);
      circle.setLatLng(at).setRadius(loc.accuracyM || 0);
      if (moved) map.panTo(at);
    }
    $('fix').textContent = `Updated ${ago(loc.ageMs)}` + (loc.accuracyM ? ` · ±${loc.accuracyM} m` : '');
    const gmaps = $('gmaps');
    gmaps.href = `https://maps.google.com/?q=${loc.lat.toFixed(5)},${loc.lng.toFixed(5)}`;
    gmaps.hidden = false;
  }

  async function poll() {
    if (done) return;
    try {
      const res = await fetch(`${base}/status`, { cache: 'no-store' });
      if (res.status === 410) return expired();
      if (res.ok) render(await res.json());
    } catch (_) { /* offline for a moment: keep the last view */ }
    setTimeout(poll, 4000);
  }

  // --- Voice (Agora Web SDK): hear only the rider; push-to-talk into their earphones. ---

  async function listen() {
    if (client) return stopListening();
    if (!window.AgoraRTC || !AgoraRTC.checkSystemRequirements()) {
      return hint('This browser can’t play live audio. Open the link in Safari or Chrome.', true);
    }
    const button = $('listen');
    button.disabled = true;
    hint('Connecting…');
    try {
      const res = await fetch(`${base}/join`, { method: 'POST' });
      if (res.status === 410) return expired();
      if (!res.ok) throw new Error(res.status === 429 ? 'Too many tries. Wait a minute and try again.' : 'Could not connect.');
      const c = await res.json();
      riderUid = c.riderUid;
      client = AgoraRTC.createClient({ mode: 'rtc', codec: 'vp8' });
      client.on('user-published', async (user, kind) => {
        if (user.uid !== riderUid || kind !== 'audio') return;
        await client.subscribe(user, 'audio');
        user.audioTrack.play();
        hint(`You can hear ${name}. Hold the button to talk.`);
      });
      client.on('user-unpublished', (user) => { if (user.uid === riderUid) hint(`${name}'s microphone is off.`); });
      client.on('user-left', (user) => { if (user.uid === riderUid) hint(`${name}'s phone left the call. Waiting for it…`, true); });
      client.on('connection-state-change', (state) => {
        if (state === 'RECONNECTING') hint('Connection lost. Reconnecting…', true);
      });
      client.on('token-privilege-did-expire', expired);
      await client.join(c.appId, c.channel, c.token, c.uid);
      button.classList.add('on');
      button.textContent = 'Stop listening';
      $('talk').disabled = micDenied;
      if (!client.remoteUsers.some((u) => u.uid === riderUid)) hint(`Waiting for ${name}’s phone to connect…`);
    } catch (error) {
      await leave();
      hint(error.message || 'Could not connect.', true);
    } finally {
      button.disabled = false;
    }
  }

  async function leave() {
    const c = client;
    client = null;
    talking = false;
    micTrack?.close();
    micTrack = null;
    $('talk').setAttribute('aria-pressed', 'false');
    if (c) await c.leave().catch(() => {});
  }

  async function stopListening() {
    await leave();
    const button = $('listen');
    button.classList.remove('on');
    button.textContent = 'Listen · सुनिए';
    $('talk').disabled = true;
    hint('Tap Listen to hear them live.');
  }

  // The mic is captured only while the button is held (setEnabled releases it): iOS Safari plays
  // quieter, or through the earpiece, while a page holds the microphone.
  function talk(on) {
    if (!client || micDenied || talking === on) return;
    talking = on;
    $('talk').setAttribute('aria-pressed', String(on));
    if (on) hint('Talking… release to listen.');
    mic = mic.then(async () => {
      if (!client) return;
      if (talking && !micTrack) {
        micTrack = await AgoraRTC.createMicrophoneAudioTrack({ AEC: true, ANS: true, AGC: true });
        await client.publish(micTrack);
      }
      if (micTrack && micTrack.enabled !== talking) await micTrack.setEnabled(talking);
      if (!talking) hint(`You can hear ${name}. Hold the button to talk.`);
    }).catch((error) => {
      talking = false;
      $('talk').setAttribute('aria-pressed', 'false');
      if (/PERMISSION_DENIED|NotAllowed/i.test(`${error.code} ${error.name} ${error.message}`)) {
        micDenied = true;
        $('talk').disabled = true;
        hint('Microphone blocked. You can still listen.', true);
      } else {
        hint('Could not start the microphone. Try again.', true);
      }
    });
  }

  if (window.AgoraRTC) {
    AgoraRTC.setLogLevel(3);
    AgoraRTC.onAutoplayFailed = () => {
      hint('Tap anywhere to hear them.', true);
      document.addEventListener('click', () => hint(`You can hear ${name}.`), { once: true });
    };
  }

  const talkButton = $('talk');
  talkButton.addEventListener('pointerdown', (e) => { e.preventDefault(); talkButton.setPointerCapture?.(e.pointerId); talk(true); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) talkButton.addEventListener(ev, () => talk(false));
  talkButton.addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); talk(true); } });
  talkButton.addEventListener('keyup', (e) => { if (e.key === ' ' || e.key === 'Enter') talk(false); });
  talkButton.addEventListener('contextmenu', (e) => e.preventDefault());
  $('listen').addEventListener('click', listen);
  // Leave at once when the page closes, so the rider's phone (and Pillion) know right away.
  addEventListener('pagehide', () => { client?.leave(); });

  poll();
})();
</script>
</body>
</html>
